[package]
name = "depo-tool"
version = "1.0.3"
description = "A Depo Tool"
authors = ["you"]
edition = "2021"

[lib]
name = "depo_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
zip = "2.1.0"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
sysinfo = "0.30"
open = "5"
lazy_static = "1.4"
tauri-plugin-dialog = "2.6.0"
regex = "1.12.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.51"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
